<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Proposal — Campus Gigs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🎓 Campus Gigs</a>
      <div class="ms-auto">
        <a href="browse-jobs.html" class="btn btn-outline-light btn-sm">
          <i class="bi bi-arrow-left me-1"></i> Back to Jobs
        </a>
      </div>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 700px;">

    <!-- Context banner — job-application.js fills this in via prefillJobContext() -->
    <div id="job-context" class="alert alert-info mb-4">
      <strong>Applying for:</strong>
      <span id="context-job-title">Loading...</span>
      &nbsp;·&nbsp;
      <strong>Budget:</strong> <span id="context-job-budget">—</span>
      &nbsp;·&nbsp;
      <strong>Expected delivery:</strong> <span id="context-delivery-days">—</span>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4">Your Proposal</h5>

        <div id="application-error"   class="alert alert-danger d-none"  role="alert"></div>
        <div id="application-success" class="alert alert-success d-none" role="alert"></div>

        <!-- id="application-form" is the hook job-application.js binds to -->
        <form id="application-form" novalidate>

          <div class="mb-3">
            <label for="cover-letter" class="form-label fw-semibold">
              Cover Letter <span class="text-danger">*</span>
            </label>
            <textarea
              class="form-control"
              id="cover-letter"
              rows="8"
              placeholder="Introduce yourself and explain why you're the right person for this job. Mention relevant experience, your approach, and any questions you have. Minimum 50 characters."
              required
              minlength="50"
              maxlength="2000"
            ></textarea>
            <div class="form-text d-flex justify-content-between">
              <span>Min 50 characters</span>
              <span id="cover-letter-count">0 / 2000</span>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="bid-amount" class="form-label fw-semibold">
                Your Bid (₦) <span class="text-danger">*</span>
              </label>
              <input
                type="number"
                class="form-control"
                id="bid-amount"
                min="1"
                step="500"
                placeholder="e.g. 25000"
                required
              />
              <div class="form-text">Client's budget shown above for reference.</div>
            </div>
            <div class="col-md-6">
              <label for="delivery-days" class="form-label fw-semibold">
                Delivery Time (days) <span class="text-danger">*</span>
              </label>
              <input
                type="number"
                class="form-control"
                id="delivery-days"
                min="1"
                placeholder="e.g. 7"
                required
              />
              <div class="form-text">How many days do you need?</div>
            </div>
          </div>

          <!-- Resume upload placeholder -->
          <!-- [EXTERNAL ACTION REQUIRED]: Enable this input after Cloudinary setup.
               See Application.js → resumeUrl for full integration instructions.
               When ready, uncomment this block and switch job-application.js from
               JSON fetch to FormData fetch (instructions in job-application.js). -->
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/notifications.js" defer></script>
    <script src="assets/job-details.js" defer></script>

          <button type="submit" id="application-submit-btn" class="btn btn-primary w-100">
            <i class="bi bi-send me-1"></i> Submit Proposal
          </button>
        </form>

        <!-- Post-submit action links — hidden until successful submission -->
        <div id="post-submit-actions" class="mt-3 d-none text-center"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/notifications.js"     defer></script>
  <script src="js/job-application.js"   defer></script>
  <script>
    // Live character counter for the cover letter textarea
    document.addEventListener("DOMContentLoaded", () => {
      const textarea = document.getElementById("cover-letter");
      const counter  = document.getElementById("cover-letter-count");
      if (textarea && counter) {
        textarea.addEventListener("input", () => {
          counter.textContent = `${textarea.value.length} / 2000`;
          counter.classList.toggle("text-danger", textarea.value.length < 50);
        });
      }
    });
  </script>
</body>
</html>
