<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Proposal — Campus Gigs</title>
  <link rel="stylesheet" href="../bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="assets/notifications.css" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #f9fafb; }
    .context-banner { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 16px 20px; margin-bottom: 24px; }
    .submit-btn { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-weight: 600; font-size: 15px; width: 100%; }
    .submit-btn:hover { background: #2563eb; }
    .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>

  <nav class="navbar navbar-light bg-white border-bottom px-3 px-md-0">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="browse-jobs.html">🎓 Campus Gigs</a>
      <a href="browse-jobs.html" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to Jobs
      </a>
    </div>
  </nav>

  <div class="container py-5" style="max-width: 720px;">

    <!-- Job context banner -->
    <div class="context-banner">
      <div class="d-flex align-items-center gap-2 mb-1">
        <i class="bi bi-briefcase text-primary"></i>
        <strong id="context-job-title">Loading job info…</strong>
      </div>
      <div class="d-flex gap-4 small text-muted mt-1">
        <span><i class="bi bi-wallet2 me-1"></i>Budget: <strong id="context-job-budget">—</strong></span>
        <span><i class="bi bi-clock me-1"></i>Expected: <strong id="context-delivery-days">—</strong></span>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4">Your Proposal</h5>

        <div id="application-error"   class="alert alert-danger  d-none" role="alert"></div>
        <div id="application-success" class="alert alert-success d-none" role="alert"></div>

        <form id="application-form" novalidate>

          <div class="mb-4">
            <label for="cover-letter" class="form-label fw-semibold">
              Cover Letter <span class="text-danger">*</span>
            </label>
            <textarea
              class="form-control"
              id="cover-letter"
              rows="8"
              placeholder="Introduce yourself and explain why you're the right person for this job. Mention relevant experience, your approach, and any questions you have. Minimum 50 characters."
              required
              minlength="50"
              maxlength="2000"
            ></textarea>
            <div class="form-text d-flex justify-content-between">
              <span>Min 50 characters</span>
              <span id="cover-letter-count">0 / 2000</span>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="bid-amount" class="form-label fw-semibold">
                Your Bid (₦) <span class="text-danger">*</span>
              </label>
              <input type="number" class="form-control" id="bid-amount" min="1" step="500" placeholder="e.g. 25000" required />
              <div class="form-text">Client's budget shown above for reference.</div>
            </div>
            <div class="col-md-6">
              <label for="delivery-days" class="form-label fw-semibold">
                Delivery Time (days) <span class="text-danger">*</span>
              </label>
              <input type="number" class="form-control" id="delivery-days" min="1" placeholder="e.g. 7" required />
              <div class="form-text">How many days do you need?</div>
            </div>
          </div>

          <div class="mb-4">
            <label for="file-attachment" class="form-label fw-semibold">
              Portfolio / Resume <span class="text-muted fw-normal">(optional)</span>
            </label>
            <input type="file" class="form-control" id="file-attachment" accept=".jpg,.jpeg,.png,.pdf" />
            <div class="form-text">PDF, JPG or PNG — max 5 MB. Attach work samples or your CV.</div>
          </div>

          <button type="submit" id="application-submit-btn" class="submit-btn">
            <i class="bi bi-send me-1"></i> Submit Proposal
          </button>

        </form>

        <div id="post-submit-actions" class="mt-3 d-none text-center"></div>
      </div>
    </div>

  </div>

  <script src="../bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/notifications.js" defer></script>
  <script src="assets/job-application.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const textarea = document.getElementById("cover-letter");
      const counter  = document.getElementById("cover-letter-count");
      if (textarea && counter) {
        textarea.addEventListener("input", () => {
          counter.textContent = `${textarea.value.length} / 2000`;
          counter.classList.toggle("text-danger", textarea.value.length < 50);
        });
      }
    });
  </script>
</body>
</html>
