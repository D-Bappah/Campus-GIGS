<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Application Submitted - Campus Gigs</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #ffffff;
            color: #111827;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .success-card {
            max-width: 500px;
            padding: 40px;
        }

        .success-icon-wrapper {
            width: 160px;
            height: 160px;
            background: #dbeafe;
            /* Light blue circle bg */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            position: relative;
        }

        .success-icon {
            font-size: 80px;
            color: #2563eb;
        }

        /* Decorative confetti dots sim */
        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .d1 {
            top: 20px;
            left: 20px;
            background: #fca5a5;
        }

        .d2 {
            top: 10px;
            right: 40px;
            background: #fcd34d;
        }

        .d3 {
            bottom: 30px;
            left: 10px;
            background: #6ee7b7;
        }

        .d4 {
            bottom: 10px;
            right: 30px;
            background: #93c5fd;
        }

        .d5 {
            top: 50%;
            left: -10px;
            background: #c4b5fd;
        }

        .d6 {
            top: 40%;
            right: -10px;
            background: #f87171;
        }

        .success-title {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .success-text {
            color: #4b5563;
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .btn-return {
            background-color: #3b82f6;
            color: white;
            padding: 14px 40px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            border: none;
            transition: background 0.2s;
        }

        .btn-return:hover {
            background-color: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <div class="success-card">
        <div class="success-icon-wrapper">
            <i class="bi bi-patch-check-fill success-icon"></i> <!-- Placeholder for confetti illustration -->
            <!-- Simple CSS dots for "party" vibe -->
            <div class="dot d1"></div>
            <div class="dot d2"></div>
            <div class="dot d3"></div>
            <div class="dot d4"></div>
            <div class="dot d5"></div>
            <div class="dot d6"></div>
        </div>

        <h1 class="success-title">Your application has been successfully submitted!</h1>
        <p class="success-text">
            Your application has been sent successfully. The employer will review it and contact you if you're
            shortlisted.
        </p>

        <a href="browse-jobs.html?mode=registered" class="btn-return">Return to job search</a>
    </div>

</body>

</html>
